services:
  - type: web
    name: tos-red-flag-scanner
    env: python
    plan: free
    region: oregon
    buildCommand: "pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_MODEL_NAME
        value: gemini-2.5-flash
      - key: GEMINI_MOCK_MODE
        value: "false"
      - key: RETRIEVAL_SIMILARITY_THRESHOLD
        value: "0.35"
      - key: GEMINI_API_KEY
        sync: false
